<!-- Express Haulers Moving - quote request form.
     Posts straight to the automation: Slack, Movegistics and ClickUp, no email involved.
     Paste into a Shopify page (Add page -> the <> code view) or a theme section. -->
<form id="eh-quote" style="max-width:560px;margin:0 auto;font-family:inherit">
  <label>Name*<br><input name="name" required style="width:100%;padding:10px;margin:6px 0"></label>
  <label>Phone*<br><input name="phone" type="tel" required style="width:100%;padding:10px;margin:6px 0"></label>
  <label>Email*<br><input name="email" type="email" required style="width:100%;padding:10px;margin:6px 0"></label>
  <label>Moving from<br><input name="moving_from" placeholder="Address, apartment/floor, stairs or elevator" style="width:100%;padding:10px;margin:6px 0"></label>
  <label>Moving to<br><input name="moving_to" style="width:100%;padding:10px;margin:6px 0"></label>
  <label>Move date<br><input name="move_date" type="date" style="width:100%;padding:10px;margin:6px 0"></label>
  <label>What needs moving?<br><textarea name="message" rows="4" placeholder="Bedrooms, big items, packing, storage" style="width:100%;padding:10px;margin:6px 0"></textarea></label>
  <!-- spam trap: real people never see or fill this in -->
  <input name="website_url" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <button type="submit" style="padding:12px 22px;margin-top:10px">Get my quote</button>
  <p id="eh-quote-msg" style="margin-top:12px"></p>
</form>
<script>
document.getElementById('eh-quote').addEventListener('submit', async function (e) {
  e.preventDefault();
  var form = e.target, note = document.getElementById('eh-quote-msg'), button = form.querySelector('button');
  button.disabled = true; note.textContent = 'Sending...';
  try {
    await fetch('https://n8n.expresshaulers.com/webhook/lead/website/314290742d8d324e7e89', {
      method: 'POST', body: new URLSearchParams(new FormData(form))
    });
    form.reset();
    note.textContent = 'Thank you! We have your request and will call you shortly.';
  } catch (err) {
    note.textContent = 'Sorry, something went wrong. Please call us on (862) 379-9113.';
    button.disabled = false;
  }
});
</script>
